[package]
name    = "esp32c3-project"
version = "0.1.0"
edition = "2024"

[[bin]]
name  = "esp32c3-project"
test  = false
bench = false

[dependencies]
embedded-hal-async = "1"
sh1106 = "0.5"
#ssd1306 = "0.10"
embedded-graphics = "0.8"
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-hal = "1"
embedded-io-async = "0.7"
esp-rtos = { version = "0.3", features = ["esp32c3", "embassy"] }   # <embedded-ide>
embassy-time = "0.5"   # <embedded-ide>
embassy-executor = "0.10"   # <embedded-ide>
esp-hal       = { version = "~1.1.0", features = ["unstable", "esp32c3"] }
esp-println   = { version = "0.13", features = ["esp32c3", "log"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
critical-section = "1.2.0"

# Flash with: espflash flash --chip esp32c3 --release
# Install:    cargo install espflash

# nb = "1.1.0"
libm = "0.2.16"
# esp32c3 = "0.33.0"
ssd1306 = { version = "0.10.0", features = ["async"] }

hmmd_mmwave_sensor_async = "0.1.0"



[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

[profile.dev]
opt-level     = "s"

[workspace]
members = []
# A detached library: kept in this folder, not built with the firmware (which
# uses the crates.io release). Excluded so cargo - and rust-analyzer - can
# load it on its own; without this, cargo refuses every command inside it.
exclude = ["hmmd_mmwave_sensor_async"]

